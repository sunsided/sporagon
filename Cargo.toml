[package]
name = "sporagon"
version = "0.1.0"
edition = "2024"
description = "Hexxagon-style mould war in a rundown fridge, in emulated VESA SVGA"
license = "EUPL-1.2"
repository = "https://github.com/sunsided/sporagon"
authors = ["Markus Mayer"]
publish = false

[dependencies]
game-toolkit-dosvideo = "0.3"

# Browser build only: the games site's restart event (src/host.rs).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "EventTarget", "Event"] }

# Procedural art and the AI search are heavy; keep debug builds playable.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
