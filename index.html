<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SPORAGON</title>
    <!-- No icon: spares the browser a request for /favicon.ico. -->
    <link rel="icon" href="data:," />
    <!-- wasm-opt rejects what current Rust emits by default unless told to accept it. -->
    <link data-trunk rel="rust" data-bin="sporagon"
      data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-multivalue --enable-reference-types" />
    <!-- The licence travels with every web build. -->
    <link data-trunk rel="copy-file" href="LICENSE" />
    <!-- The toolkit fetches assets/manifest.txt on start; it lists nothing. -->
    <link data-trunk rel="copy-dir" href="assets" />
    <style>
      html, body { margin: 0; height: 100%; background: #000; }
      body { display: flex; align-items: center; justify-content: center; }
      /* 4:3, the game's 640x480 screen. */
      #sporagon {
        outline: none;
        width: min(100vw, calc(100vh * 4 / 3)) !important;
        height: min(100vh, calc(100vw * 3 / 4)) !important;
        touch-action: none;
      }
      /* Shown until the game has painted its scene; the game removes it (src/host.rs). */
      #loading {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px;
        color: #c8c4a8; font: 16px/1.4 "Courier New", monospace; letter-spacing: 0.2em;
        pointer-events: none;
      }
      #loading .spore {
        width: 44px; height: 44px; border-radius: 50%;
        border: 4px solid #2a4a3c; border-top-color: #6fb08e;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #loading .spore { animation: none; } }
    </style>
  </head>
  <body>
    <!-- The game binds to this id; the games site creates a canvas of the same id. -->
    <canvas id="sporagon" tabindex="0"></canvas>
    <div id="loading" role="status" aria-live="polite">
      <div class="spore"></div>
      <div>GROWING MOULD&hellip;</div>
    </div>
  </body>
</html>
